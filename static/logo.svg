<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1525;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#22c55e" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ef4444" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Blue-black background -->
  <rect width="400" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="400" y2="80" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="400" x2="400" y2="400" stroke="#22c55e" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="480" stroke="#22c55e" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="480" stroke="#22c55e" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="480" stroke="#22c55e" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#22c55e" stroke-width="1"/>
  </g>
  
  <!-- Shield outer border (green) -->
  <path d="M200 40 L330 90 Q340 94 340 104 L340 220 Q340 300 280 350 L200 420 L120 350 Q60 300 60 220 L60 104 Q60 94 70 90 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#greenGlow)"/>
  
  <!-- Shield inner fill -->
  <path d="M200 55 L320 100 Q328 103 328 112 L328 220 Q328 290 272 337 L200 400 L128 337 Q72 290 72 220 L72 112 Q72 103 80 100 Z" 
        fill="#0c1220" stroke="#1a3a2a" stroke-width="2"/>
  
  <!-- Inner highlight -->
  <path d="M200 70 L310 112 Q316 114 316 120 L316 218 Q316 282 264 324 L200 384 L136 324 Q84 282 84 218 L84 120 Q84 114 90 112 Z" 
        fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  
  <!-- CHINESE TEXT: 哨兵 — will render via web font -->
  <text x="200" y="220" text-anchor="middle" 
        font-family="'Noto Sans SC', 'Microsoft YaHei', 'SimHei', 'STHeiti', 'Heiti SC', 'PingFang SC', 'WenQuanYi Micro Hei', sans-serif" 
        font-size="110" font-weight="900" fill="#ef4444" filter="url(#redGlow)" letter-spacing="8">哨兵</text>
  
  <!-- SENTINEL subtitle -->
  <text x="200" y="275" text-anchor="middle" 
        font-family="Inter, system-ui, sans-serif" 
        font-size="22" font-weight="700" fill="#22c55e" letter-spacing="12" opacity="0.8">SENTINEL</text>
  
  <!-- Decorative lines -->
  <line x1="140" y1="130" x2="260" y2="130" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="300" x2="260" y2="300" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Diamonds -->
  <polygon points="200,100 206,112 200,124 194,112" fill="#22c55e" opacity="0.6"/>
  <polygon points="200,310 206,322 200,334 194,322" fill="#22c55e" opacity="0.4"/>
  
  <!-- Bottom mini shield -->
  <path d="M200 345 L212 351 L212 363 L200 371 L188 363 L188 351 Z" fill="#22c55e" opacity="0.3"/>
</svg>