<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #0a0a0f; display: flex; justify-content: center; align-items: center; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1000" height="1000"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1000, H = 1000;
const cx = W/2, cy = H/2;

// Background — dark with subtle radial
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 500);
bgGrad.addColorStop(0, 'rgba(99,102,241,0.04)');
bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

// === HEXAGONAL SHIELD ===
const hexR = 260;
function hexPoints(cx, cy, r, rotation = 0) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 2 + rotation;
        pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
    }
    return pts;
}

// Outer glow layers
for (let i = 10; i > 0; i--) {
    const pts = hexPoints(cx, cy, hexR + i * 8);
    ctx.beginPath();
    pts.forEach((p, j) => j === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    ctx.strokeStyle = `rgba(99,102,241,${0.03 * i})`;
    ctx.lineWidth = 20 + i * 6;
    ctx.stroke();
}

// Main hexagon border
const mainHex = hexPoints(cx, cy, hexR);
ctx.beginPath();
mainHex.forEach((p, j) => j === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
ctx.closePath();

// Fill
const hexGrad = ctx.createLinearGradient(cx - hexR, cy - hexR, cx + hexR, cy + hexR);
hexGrad.addColorStop(0, 'rgba(99,102,241,0.12)');
hexGrad.addColorStop(0.5, 'rgba(139,92,246,0.08)');
hexGrad.addColorStop(1, 'rgba(168,85,247,0.12)');
ctx.fillStyle = hexGrad;
ctx.fill();

// Border — indigo to purple gradient
const borderGrad = ctx.createLinearGradient(cx - hexR, cy - hexR, cx + hexR, cy + hexR);
borderGrad.addColorStop(0, '#6366f1');
borderGrad.addColorStop(0.5, '#8b5cf6');
borderGrad.addColorStop(1, '#a855f7');
ctx.strokeStyle = borderGrad;
ctx.lineWidth = 5;
ctx.stroke();

// Inner hexagon (smaller)
const innerHex = hexPoints(cx, cy, hexR - 20);
ctx.beginPath();
innerHex.forEach((p, j) => j === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
ctx.closePath();
ctx.strokeStyle = 'rgba(139,92,246,0.2)';
ctx.lineWidth = 1.5;
ctx.stroke();

// Second inner hex
const innerHex2 = hexPoints(cx, cy, hexR - 45);
ctx.beginPath();
innerHex2.forEach((p, j) => j === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
ctx.closePath();
ctx.strokeStyle = 'rgba(139,92,246,0.1)';
ctx.lineWidth = 1;
ctx.stroke();

// === INTERLOCKING CHAIN LINKS (center) ===
function drawChainLink(x, y, w, h, angle, color, lw) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, h/2);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
    ctx.restore();
}

// Chain pair 1 (top-left to bottom-right)
const chainGrad1 = ctx.createLinearGradient(cx - 80, cy - 40, cx + 80, cy + 40);
chainGrad1.addColorStop(0, '#6366f1');
chainGrad1.addColorStop(1, '#a855f7');

drawChainLink(cx - 30, cy - 15, 70, 35, -0.3, chainGrad1, 5);
drawChainLink(cx + 30, cy + 15, 70, 35, -0.3, chainGrad1, 5);

// Chain pair 2 (top-right to bottom-left)
const chainGrad2 = ctx.createLinearGradient(cx + 80, cy - 40, cx - 80, cy + 40);
chainGrad2.addColorStop(0, '#a855f7');
chainGrad2.addColorStop(1, '#6366f1');

drawChainLink(cx + 30, cy - 15, 60, 30, 0.3, chainGrad2, 4);
drawChainLink(cx - 30, cy + 15, 60, 30, 0.3, chainGrad2, 4);

// Chain glow
for (let i = 4; i > 0; i--) {
    drawChainLink(cx - 30, cy - 15, 70 + i*4, 35 + i*2, -0.3, `rgba(99,102,241,${0.04 * i})`, 8 + i*3);
    drawChainLink(cx + 30, cy + 15, 70 + i*4, 35 + i*2, -0.3, `rgba(99,102,241,${0.04 * i})`, 8 + i*3);
}

// === SCAN LINE (horizontal) ===
const scanY = cy + 5;
ctx.beginPath();
ctx.moveTo(cx - hexR + 60, scanY);
ctx.lineTo(cx + hexR - 60, scanY);
const scanGrad = ctx.createLinearGradient(cx - hexR + 60, 0, cx + hexR - 60, 0);
scanGrad.addColorStop(0, 'rgba(99,102,241,0)');
scanGrad.addColorStop(0.3, 'rgba(139,92,246,0.4)');
scanGrad.addColorStop(0.5, 'rgba(168,85,247,0.6)');
scanGrad.addColorStop(0.7, 'rgba(139,92,246,0.4)');
scanGrad.addColorStop(1, 'rgba(99,102,241,0)');
ctx.strokeStyle = scanGrad;
ctx.lineWidth = 2;
ctx.setLineDash([8, 6]);
ctx.stroke();
ctx.setLineDash([]);

// === SCAN PULSE DOTS ===
const pulsePositions = [
    { x: cx - 100, y: scanY, r: 4, delay: 0 },
    { x: cx - 30, y: scanY, r: 5, delay: 0.3 },
    { x: cx + 40, y: scanY, r: 4, delay: 0.6 },
    { x: cx + 110, y: scanY, r: 3, delay: 0.9 },
];

pulsePositions.forEach(p => {
    // Outer glow
    const pGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
    pGrad.addColorStop(0, 'rgba(168,85,247,0.3)');
    pGrad.addColorStop(1, 'rgba(168,85,247,0)');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Core dot
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = '#c084fc';
    ctx.fill();
    
    // Bright center
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#e0d4ff';
    ctx.fill();
});

// === CORNER ACCENT DOTS (hexagon vertices) ===
mainHex.forEach((p, i) => {
    // Outer glow
    const cGrad = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 18);
    cGrad.addColorStop(0, 'rgba(139,92,246,0.4)');
    cGrad.addColorStop(1, 'rgba(139,92,246,0)');
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(p[0], p[1], 18, 0, Math.PI * 2);
    ctx.fill();
    
    // Dot
    ctx.beginPath();
    ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
    const colors = ['#6366f1', '#8b5cf6', '#a855f7', '#6366f1', '#8b5cf6', '#a855f7'];
    ctx.fillStyle = colors[i];
    ctx.fill();
});

// === CORNER CONNECTOR LINES (subtle) ===
for (let i = 0; i < 6; i++) {
    const p1 = mainHex[i];
    const p2 = mainHex[(i + 1) % 6];
    const mx = (p1[0] + p2[0]) / 2;
    const my = (p1[1] + p2[1]) / 2;
    
    // Small dot at midpoint
    ctx.beginPath();
    ctx.arc(mx, my, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(139,92,246,0.3)';
    ctx.fill();
}

// === DECORATIVE CROSS LINES ===
ctx.beginPath();
ctx.moveTo(cx, cy - hexR + 30);
ctx.lineTo(cx, cy + hexR - 30);
ctx.moveTo(cx - hexR + 30, cy);
ctx.lineTo(cx + hexR - 30, cy);
ctx.strokeStyle = 'rgba(99,102,241,0.08)';
ctx.lineWidth = 1;
ctx.stroke();

// === TEXT ===
// SENTINEL
ctx.font = '900 68px "Inter", "DejaVu Sans", sans-serif';
ctx.textAlign = 'center';

// Glow
ctx.shadowColor = '#8b5cf6';
ctx.shadowBlur = 25;
ctx.fillStyle = '#c084fc';
ctx.fillText('SENTINEL', cx, cy + hexR + 80);
ctx.shadowBlur = 0;

// Clean text
ctx.fillStyle = '#e8e0ff';
ctx.fillText('SENTINEL', cx, cy + hexR + 80);

// 哨兵
ctx.font = '900 54px "WenQuanYi Zen Hei", "Noto Sans SC", sans-serif';
ctx.shadowColor = '#ef4444';
ctx.shadowBlur = 15;
ctx.fillStyle = '#ef4444';
ctx.fillText('哨兵', cx, cy + hexR + 145);
ctx.shadowBlur = 0;
ctx.fillStyle = '#ef4444';
ctx.fillText('哨兵', cx, cy + hexR + 145);

// Tagline
ctx.font = '500 16px "Inter", "DejaVu Sans", sans-serif';
ctx.fillStyle = '#555a65';
ctx.fillText('TOKEN SAFETY SCANNER', cx, cy + hexR + 185);

// Decorative lines
ctx.beginPath();
ctx.moveTo(cx - 180, cy + hexR + 55);
ctx.lineTo(cx - 50, cy + hexR + 55);
ctx.moveTo(cx + 50, cy + hexR + 55);
ctx.lineTo(cx + 180, cy + hexR + 55);
ctx.strokeStyle = 'rgba(139,92,246,0.3)';
ctx.lineWidth = 1.5;
ctx.stroke();

// Diamonds at line ends
[[-188, 0], [188, 0]].forEach(([dx]) => {
    const dy = cy + hexR + 55;
    ctx.beginPath();
    ctx.moveTo(cx + dx, dy - 5);
    ctx.lineTo(cx + dx + 5, dy);
    ctx.lineTo(cx + dx, dy + 5);
    ctx.lineTo(cx + dx - 5, dy);
    ctx.closePath();
    ctx.fillStyle = '#8b5cf6';
    ctx.fill();
});

// === SMALL SHIELD ICON at top ===
const iconY = cy - hexR - 30;
ctx.beginPath();
ctx.moveTo(cx, iconY - 20);
ctx.lineTo(cx + 14, iconY - 8);
ctx.lineTo(cx + 14, iconY + 8);
ctx.lineTo(cx, iconY + 20);
ctx.lineTo(cx - 14, iconY + 8);
ctx.lineTo(cx - 14, iconY - 8);
ctx.closePath();
ctx.fillStyle = 'rgba(139,92,246,0.3)';
ctx.fill();
ctx.strokeStyle = '#8b5cf6';
ctx.lineWidth = 1.5;
ctx.stroke();

</script>
</body>
</html>
