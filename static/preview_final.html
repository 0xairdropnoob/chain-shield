<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #0a0a0f; display: flex; justify-content: center; align-items: center; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="600"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1200, H = 600;
const cx = W/2, cy = H/2;

// Background
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);

// === SHIELD ICON (small, above text) ===
const shieldCx = cx;
const shieldCy = cy - 130;
const sW = 50, sH = 60;

// Shield glow
for (let i = 5; i > 0; i--) {
    ctx.beginPath();
    ctx.moveTo(shieldCx, shieldCy - sH/2 - i*3);
    ctx.lineTo(shieldCx + sW/2 + i*3, shieldCy - sH/4);
    ctx.lineTo(shieldCx + sW/2 + i*3, shieldCy + sH/6);
    ctx.lineTo(shieldCx, shieldCy + sH/2 + i*3);
    ctx.lineTo(shieldCx - sW/2 - i*3, shieldCy + sH/6);
    ctx.lineTo(shieldCx - sW/2 - i*3, shieldCy - sH/4);
    ctx.closePath();
    ctx.strokeStyle = `rgba(99,102,241,${0.08 * i})`;
    ctx.lineWidth = 6;
    ctx.stroke();
}

// Shield fill
ctx.beginPath();
ctx.moveTo(shieldCx, shieldCy - sH/2);
ctx.lineTo(shieldCx + sW/2, shieldCy - sH/4);
ctx.lineTo(shieldCx + sW/2, shieldCy + sH/6);
ctx.lineTo(shieldCx, shieldCy + sH/2);
ctx.lineTo(shieldCx - sW/2, shieldCy + sH/6);
ctx.lineTo(shieldCx - sW/2, shieldCy - sH/4);
ctx.closePath();

const shieldGrad = ctx.createLinearGradient(shieldCx - sW/2, shieldCy - sH/2, shieldCx + sW/2, shieldCy + sH/2);
shieldGrad.addColorStop(0, '#6366f1');
shieldGrad.addColorStop(0.5, '#8b5cf6');
shieldGrad.addColorStop(1, '#a855f7');
ctx.fillStyle = shieldGrad;
ctx.fill();

// Shield inner highlight
ctx.beginPath();
ctx.moveTo(shieldCx, shieldCy - sH/2 + 6);
ctx.lineTo(shieldCx + sW/2 - 6, shieldCy - sH/4 + 2);
ctx.lineTo(shieldCx + sW/2 - 6, shieldCy + sH/6 - 2);
ctx.lineTo(shieldCx, shieldCy + sH/2 - 6);
ctx.lineTo(shieldCx - sW/2 + 6, shieldCy + sH/6 - 2);
ctx.lineTo(shieldCx - sW/2 + 6, shieldCy - sH/4 + 2);
ctx.closePath();
ctx.strokeStyle = 'rgba(255,255,255,0.3)';
ctx.lineWidth = 1.5;
ctx.stroke();

// Small checkmark inside shield
ctx.beginPath();
ctx.moveTo(shieldCx - 10, shieldCy);
ctx.lineTo(shieldCx - 2, shieldCy + 8);
ctx.lineTo(shieldCx + 12, shieldCy - 8);
ctx.strokeStyle = 'rgba(255,255,255,0.8)';
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.stroke();
ctx.lineCap = 'butt';
ctx.lineJoin = 'miter';

// === MAIN TEXT: CHAIN SENTINEL ===
// "CHAIN" — left side
ctx.font = '900 88px "Inter", "DejaVu Sans", sans-serif';
ctx.textAlign = 'left';

const chainW = ctx.measureText('CHAIN').width;
const sentW = ctx.measureText('SENTINEL').width;
const dotW = 20;
const totalW = chainW + dotW + 10 + sentW;
const startX = cx - totalW / 2;

// CHAIN — white with indigo glow
ctx.shadowColor = '#6366f1';
ctx.shadowBlur = 25;
ctx.fillStyle = '#6366f1';
ctx.fillText('CHAIN', startX, cy + 10);
ctx.shadowBlur = 0;
ctx.fillStyle = '#e8eaff';
ctx.fillText('CHAIN', startX, cy + 10);

// Separator dot
ctx.beginPath();
ctx.arc(startX + chainW + dotW/2 + 5, cy + 10, 5, 0, Math.PI * 2);
ctx.fillStyle = '#8b5cf6';
ctx.fill();

// "SENTINEL" — right side
ctx.shadowColor = '#6366f1';
ctx.shadowBlur = 25;
ctx.fillStyle = '#6366f1';
ctx.fillText('SENTINEL', startX + chainW + dotW + 10, cy + 10);
ctx.shadowBlur = 0;
ctx.fillStyle = '#e8eaff';
ctx.fillText('SENTINEL', startX + chainW + dotW + 10, cy + 10);

// === TAGLINE ===
ctx.font = '500 18px "Inter", "DejaVu Sans", sans-serif';
ctx.textAlign = 'center';
ctx.fillStyle = '#22c55e';
ctx.fillText('TOKEN SAFETY SCANNER', cx, cy + 55);

// === ACCENT LINES ===
// Top line
ctx.beginPath();
ctx.moveTo(cx - 200, cy - 80);
ctx.lineTo(cx + 200, cy - 80);
const topLine = ctx.createLinearGradient(cx - 200, 0, cx + 200, 0);
topLine.addColorStop(0, 'rgba(99,102,241,0)');
topLine.addColorStop(0.3, 'rgba(99,102,241,0.4)');
topLine.addColorStop(0.5, 'rgba(139,92,246,0.6)');
topLine.addColorStop(0.7, 'rgba(99,102,241,0.4)');
topLine.addColorStop(1, 'rgba(99,102,241,0)');
ctx.strokeStyle = topLine;
ctx.lineWidth = 1.5;
ctx.stroke();

// Bottom line
ctx.beginPath();
ctx.moveTo(cx - 160, cy + 75);
ctx.lineTo(cx + 160, cy + 75);
const botLine = ctx.createLinearGradient(cx - 160, 0, cx + 160, 0);
botLine.addColorStop(0, 'rgba(34,197,94,0)');
botLine.addColorStop(0.3, 'rgba(34,197,94,0.3)');
botLine.addColorStop(0.5, 'rgba(34,197,94,0.5)');
botLine.addColorStop(0.7, 'rgba(34,197,94,0.3)');
botLine.addColorStop(1, 'rgba(34,197,94,0)');
ctx.strokeStyle = botLine;
ctx.lineWidth = 1;
ctx.stroke();

// Corner brackets
const bs = 18, bo = 35;
// Top-left
ctx.beginPath();
ctx.moveTo(cx - 350, cy - 170 + bs);
ctx.lineTo(cx - 350, cy - 170);
ctx.lineTo(cx - 350 + bs, cy - 170);
ctx.strokeStyle = 'rgba(99,102,241,0.3)';
ctx.lineWidth = 1.5;
ctx.stroke();
// Top-right
ctx.beginPath();
ctx.moveTo(cx + 350, cy - 170 + bs);
ctx.lineTo(cx + 350, cy - 170);
ctx.lineTo(cx + 350 - bs, cy - 170);
ctx.stroke();
// Bottom-left
ctx.beginPath();
ctx.moveTo(cx - 350, cy + 150 - bs);
ctx.lineTo(cx - 350, cy + 150);
ctx.lineTo(cx - 350 + bs, cy + 150);
ctx.stroke();
// Bottom-right
ctx.beginPath();
ctx.moveTo(cx + 350, cy + 150 - bs);
ctx.lineTo(cx + 350, cy + 150);
ctx.lineTo(cx + 350 - bs, cy + 150);
ctx.stroke();

</script>
</body>
</html>
